name: Auto-update
on:
  schedule:
    - cron: '0 8 1,15 * *' # every 1st and 15th at 08:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27

      - name: Update flake inputs
        run: nix flake update

      - name: Sync upstream waycal
        run: |
          git clone --depth 1 https://github.com/ForrestKnight/waycal.git /tmp/upstream
          cp -r /tmp/upstream/src/* src/
          cp /tmp/upstream/Cargo.lock .
          cp /tmp/upstream/Cargo.toml .

      - name: Sync version
        run: |
          UPSTREAM_VER=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          sed -i "s|version = \".*\";|version = \"${UPSTREAM_VER}\";|" flake.nix

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        if: steps.diff.outputs.changed == 'true'
        run: nix build

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: auto-update waycal and flake inputs"
          git push
